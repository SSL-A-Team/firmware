[package]
name = "ateam-lib-stm32"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A common library for ateam stm32 targets"
repository = "https://github.com/SSL-A-Team/firmware"

[dependencies]
ateam-lib-crossarch = { path = "../lib-crossarch", features = ["defmt", "smart-leds"] }
embassy-stm32 = { version = "0.6.0", default-features = false, features = ["exti"]}
embassy-executor = { version = "0.10.0", default-features = false }
embassy-sync = { version = "0.8.0" }
embassy-futures = { version = "0.1.2" }
embassy-time = { version = "0.5.1" }
paste = { version = "1.0.15" }

defmt = "1.0.1"
defmt-rtt = "1.0.0"
critical-section = "1.1.1"

heapless  = "0.9.1"

libm = "0.2"
nalgebra = { version = "0.34.0", default-features = false, features = ["libm", "macros"] }
num-traits = { version = "0.2.19", default-features = false }
smart-leds = "0.4.0"

[features]
default = ["embassy-stm32/stm32h723zg"]
strict = ["embassy-stm32/stm32h723zg"]
# stm32h723zg = []

[dev-dependencies]
defmt-test = "0.4.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

[lib]
test = false
harness = false

[[test]]
name = "linear-map"
harness = false

[[test]]
name = "queue"
harness = false
